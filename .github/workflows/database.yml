name: Database integration
on: [push, pull_request]
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:test
      - run: npm run db:test:integration
      - run: npm run test:budget:integration
      - run: npm run test:reviews:integration
      - run: npm run build
      - run: npm run test:editorial:web
      - run: npm run db:stop
        if: always()
